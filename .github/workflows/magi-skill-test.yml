name: MAGI skill tests

on:
  push:
    paths:
      - '.agents/skills/magi-council/**'
      - '.github/agents/magi-*.agent.md'
      - '.github/hooks/magi-council.json'
      - '.magi/**'
      - 'src/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    paths:
      - '.agents/skills/magi-council/**'
      - '.github/agents/magi-*.agent.md'
      - '.github/hooks/magi-council.json'
      - '.magi/**'
      - 'src/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --locked
